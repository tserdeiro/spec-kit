name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linear:
    name: spec-kit-linear tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest packages/spec-kit-linear/tests

  code-review:
    name: spec-kit-code-review tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Configure git for the temporary repositories the suite builds
        run: |
          set -euo pipefail
          git config --global user.email "ci@example.invalid"
          git config --global user.name "spec-kit CI"
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false
      - run: uv run pytest packages/spec-kit-code-review/tests
