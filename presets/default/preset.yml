schema_version: "1.0"

preset:
  id: "default"
  name: "Default Workflow Templates"
  version: "0.9.0"
  description: "Spec, plan, tasks, and checklist templates with the integration-branch delivery workflow and its commands"
  author: "tserdeiro"
  repository: "https://github.com/tserdeiro/spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.0.1,<1.1.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Feature specification"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Implementation plan"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Task list with the integration-branch delivery conventions"
      replaces: "tasks-template"

    - type: "template"
      name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "Quality checklist"
      replaces: "checklist-template"

    - type: "command"
      name: "speckit.pr"
      file: "commands/pr.md"
      description: "Guarantee the task branch and open the canonical draft PR from the feature artifacts"

    - type: "command"
      name: "speckit.specify"
      file: "commands/phase-close-append.md"
      description: "Appends the phase-close rules (silent hooks, scoped artifact commit) to the core specify command"
      strategy: "append"

    - type: "command"
      name: "speckit.plan"
      file: "commands/phase-close-append.md"
      description: "Appends the phase-close rules (silent hooks, scoped artifact commit) to the core plan command"
      strategy: "append"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/phase-close-append.md"
      description: "Appends the phase-close rules (silent hooks, scoped artifact commit) to the core analyze command"
      strategy: "append"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/tasks-append.md"
      description: "Appends the one-task-at-a-time rule and the phase-close rules to the core tasks command"
      strategy: "append"

    - type: "command"
      name: "speckit.implement"
      file: "commands/implement-append.md"
      description: "Appends the branch-per-task delivery loop to the core implement command"
      strategy: "append"

    - type: "script"
      name: "task-base"
      file: "scripts/python/task_base.py"
      description: "Per-task branch setup: refresh, task, and work-item modes"
      strategy: "replace"

    - type: "script"
      name: "pr-create"
      file: "scripts/python/pr_create.py"
      description: "Resolve and print the delivery base for a feature, task, or work-item PR"
      strategy: "replace"

    - type: "script"
      name: "budget-stop"
      file: "scripts/python/budget_stop.py"
      description: "Stop a task before its authored lines pass the review budget"
      strategy: "replace"

    - type: "script"
      name: "stack-propagate"
      file: "scripts/python/stack_propagate.py"
      description: "Carry a fix on a branch through every open task PR stacked on it"
      strategy: "replace"

    - type: "script"
      name: "merge-root-first"
      file: "scripts/python/merge_root_first.py"
      description: "Retarget and merge every open task PR onto the feature branch, root-first, on explicit human request"
      strategy: "replace"

    - type: "script"
      name: "ledger-check"
      file: "scripts/python/ledger_check.py"
      description: "Verify a task's ledger entry is checked with its Completion evidence filled"
      strategy: "replace"

    - type: "script"
      name: "skill-mirror"
      file: "scripts/python/skill_mirror.py"
      description: "Mirror extension and preset skills whole across installed integrations and append the preset's registered layer to each core render"
      strategy: "replace"

    - type: "script"
      name: "ignore-entries"
      file: "scripts/python/ignore_entries.py"
      description: "Add the installer's cache and payload-venv directories to .gitignore when not already covered"
      strategy: "replace"

    - type: "command"
      name: "speckit.doctor"
      file: "commands/doctor.md"
      description: "Run every installed extension's doctor, mirror the skills across installed agents, and summarize one result"

    - type: "command"
      name: "speckit.chore"
      file: "commands/chore.md"
      description: "Start a maintenance chore from its Linear issue key: issue-key branch, then the direct change"

    - type: "command"
      name: "speckit.bugfix"
      file: "commands/bugfix.md"
      description: "Start a bug fix from its Linear issue key: issue-key branch, then the triage trio"

tags:
  - "workflow"
  - "templates"
  - "sdd"
