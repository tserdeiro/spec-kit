[project]
name = "spec-kit-code-review"
version = "0.2.1"
description = "Review a fixed Spec Kit pull-request candidate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tserdeiro" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_kit_code_review"]
