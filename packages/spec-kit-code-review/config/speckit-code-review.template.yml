schema_version: "1.0"

repository:
  slug: "spec-kit"
  github: "tserdeiro/spec-kit"
  remote: "origin"

engine:
  ocr_version: "v1.8.3"
  rule_batch_size: 100
  timeout_seconds: 300

packet:
  # UTF-8 source bytes are shared across every excerpt from one artifact.
  max_bytes_per_artifact: 60000
  # Final rendered packet bytes, including metadata, escaping and instructions.
  max_total_bytes: 400000
  include_checklists: true
  include_pr_body: true

budget:
  # Authored executable lines added. Over this, the review warns and suggests
  # stacked pull requests; it never fails.
  limit: 400

protected_paths:
  # Task pull requests (base branch NNN-...) that touch any of these get an
  # automatic blocking finding; the feature pull request itself is exempt.
  - "specs/*/spec.md"
  - ".specify/memory/constitution.md"

publish:
  event: "request-changes"
  batch_size: 25
  max_inline_comments: 100
  max_listed_files: 3000
  max_scanned_comments: 300
  summary_marker: "speckit-code-review:summary"

evidence:
  keep_sessions: 20
