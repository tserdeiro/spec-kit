[project]
name = "spec-kit-linear"
version = "0.6.1"
description = "Local-first Spec Kit to Linear projection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tserdeiro" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_kit_linear"]
